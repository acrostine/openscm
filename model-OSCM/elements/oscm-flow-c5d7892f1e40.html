						<div class="markdown-doc"><script type="text/plain">**Sustainability Action Plan is issued** when gap treatment actions are selected and approved. The Sustainability Action Plan specifies the correction actions for each gap: action owner, due date, required resources, and the target value each action is expected to achieve. Its arrival means planned corrective work is committed and ready for tracking. Progress monitoring against the plan begins; each action's completion status and achieved value are tracked against its due date. This handover ensures monitoring has a committed action set and gap closures are verified.</script></div>
