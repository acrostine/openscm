						<div class="markdown-doc"><script type="text/plain">**When a Workload Forecast arrives.** Each planning period, this work checks the forecast against the current Resource Plan. It determines the people, budget, and systems needed, issues Capability Requirements for skill gaps, and prioritises Budget Requests against available funding. The goal is a plan that meets demand without overcommitment and keeps queues within service levels.

**Plans stay within approved budget.** The Resource Plan depends on complete, signed Workload Forecasts and current, approved Process Standards. It produces a Resource Plan each period, a Capability Requirement when a skill gap appears, and a Budget Request when funding falls short. Allocation never exceeds the approved Budget without a Budget Amendment.

**Skill gaps become Capability Requirements.** A **Capability Requirement** is rejected when it is unfunded.</script></div>
