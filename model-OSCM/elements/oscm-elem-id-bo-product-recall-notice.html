						<div class="markdown-doc"><script type="text/plain">**A notification to retrieve defective products.** Product Recall Notice records the identification of products that must be withdrawn from the market due to safety or quality concerns. Quality or regulatory teams create the notice when a defect is discovered. Sell Renewal, Source Returns, and Deliver Returns processes use it to coordinate the return and replacement of affected items. The record includes product details, reason for recall, and required actions, ensuring timely and compliant handling of product issues.</script></div>
