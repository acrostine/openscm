							<br>
						<div class="markdown-doc"><script type="text/plain">**Inquiry Record enables supply chain segmentation.** Once logged with enough detail to act on and assigned a unique identifier, the record carries requester identity, stated need, desired outcome, response deadline, and channel of first contact. It arrives ready for segmentation work. Its arrival causes supply chains to be assigned to segments using the inquiry's product, service, location, or volume attributes, ensuring the inquiry's demand signal is included and its requirements are not omitted.</script></div>
