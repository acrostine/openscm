						<div class="markdown-doc"><script type="text/plain">**A supply chain performance metric group.** Responsiveness collects the measures that show how quickly a supply chain detects and responds to changes in demand, supply, or operating conditions. It sits alongside other metric groups such as Dependability, Adaptability, Cost, Asset Efficiency, Sustainability, Key Risk, and Profitability in the Metrics category. The model uses this grouping to give planners and decision makers a single place to review time-related performance. The individual members of Responsiveness are the specific speed and reaction measurements that an organisation chooses to track.</script></div>
