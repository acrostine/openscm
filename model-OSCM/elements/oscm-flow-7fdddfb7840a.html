							<br>
						<div class="markdown-doc"><script type="text/plain">**Effectiveness Review delivers measured results** by documenting the advisory's action results against the original success measures, including variance and residual issues. It is issued after the monitoring period has produced sufficient evidence to assess outcomes, so its arrival means the results are available for a closure decision. The advisory is then closed using this outcome evidence, with residual issues recorded. Without the Effectiveness Review, the advisory closure proceeds without measured results.</script></div>
