							<br>
						<div class="markdown-doc"><script type="text/plain">**Tax Impact Assessment guides network decisions** by computing the tax obligations, incentives, and exemptions associated with each candidate network configuration. It is produced after the supply chain strategy is analysed for tax implications, giving the network definition the tax position of each option. The supply chain network is then defined with the tax impact accounted for, selecting configurations that minimise exposure. This protects the network from being defined without the tax cost and prevents unplanned liabilities later.</script></div>
