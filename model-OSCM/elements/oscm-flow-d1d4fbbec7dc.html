							<br>
						<div class="markdown-doc"><script type="text/plain">**A customer-approved Project Order** specifies the project deliverable, milestones, agreed pricing, billing schedule, and any customer-specific requirements. When this order is created with a valid project reference, resource scheduling reserves the necessary capacity and assigns it to the project. This handover ensures capacity is reserved before the project begins, so the project does not compete with other work unprepared. This protects against capacity remaining unreserved and the project entering competition unprepared.</script></div>
