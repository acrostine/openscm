							<br>
						<div class="markdown-doc"><script type="text/plain">**Policy map defines monitoring scope** when all relevant network elements are associated with the policy. It connects each compliance policy to the specific network nodes, materials, and activities it governs, along with thresholds and evidence requirements. This complete coverage definition allows monitoring and audit to focus on the mapped elements and compare actual performance to policy thresholds. The handover ensures obligations are checked at the correct points rather than leaving monitoring without a defined scope.</script></div>
