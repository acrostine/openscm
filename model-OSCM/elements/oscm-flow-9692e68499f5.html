						<div class="markdown-doc"><script type="text/plain">**Current material availability** is determined against demand and delivered as the Material Availability notice. The notice indicates which materials are available for issue or staging, including material identity, quantity available, location, and any constraints. Its arrival provides the current availability status, so the issue or staging activity proceeds using only confirmed available materials. This handover prevents staging attempts from including materials not on hand and thereby avoids the delays that such attempts would otherwise cause.</script></div>
