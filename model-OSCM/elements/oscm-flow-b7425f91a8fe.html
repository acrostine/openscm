						<div class="markdown-doc"><script type="text/plain">**Authorised disposition** is reached once an item has been evaluated and a choice is formally approved. The disposition decision carries the affected item, its condition, the selected action such as rework, scrap, or return, and the reason for that choice. Its arrival creates a work order for the selected action, so the item is processed accordingly. This handover moves the item out of pending-disposition and ensures the chosen outcome is executed.</script></div>
