						<div class="markdown-doc"><script type="text/plain">**A supplier that provides goods or services.** A seller is the party that fulfills purchase orders by delivering products or performing services. In this model, the seller receives purchase orders and provides product delivery and service delivery information. The seller uses these records to confirm order acceptance, schedule production or service execution, and track delivery progress. Buyers and logistics providers rely on the seller to fulfill orders accurately and on time. The seller's decisions about inventory allocation, production scheduling, and order fulfillment directly affect supply chain performance and customer satisfaction.</script></div>
