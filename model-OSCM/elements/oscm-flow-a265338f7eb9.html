							<br>
						<div class="markdown-doc"><script type="text/plain">**Prioritized Root Cause List directs solution development.** The list ranks confirmed root causes by impact, occurrence frequency, and ease of correction. Each entry references the original Root Cause Record and includes the priority score. It is issued when all root cause records from the analysis period are scored and ordered, meaning the highest-priority causes are handed over for solution design. Designers allocate effort according to the list's order, starting with the highest-ranked causes. Without this list, solution work starts without an agreed cause priority, and low-impact causes consume resources ahead of high-impact ones.</script></div>
