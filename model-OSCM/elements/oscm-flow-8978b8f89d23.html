						<div class="markdown-doc"><script type="text/plain">**Goods Receipt confirming physical receipt** documents that goods have been received from an internal or external transfer, including item, quantity, condition, and receipt timestamp. It is issued when the transfer is completed and the goods are physically received. Its arrival proves receipt. Put-away can then begin with verified goods, and inventory records include the received stock. This ensures received goods are accounted for and can be placed into storage with accurate inventory.</script></div>
