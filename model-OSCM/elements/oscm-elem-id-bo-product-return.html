						<div class="markdown-doc"><script type="text/plain">**A record of returned product.** This record captures the details of a product being sent back by a customer, including reason, condition, and quantity. It is created when a return request is approved and used throughout the returns process. Sourcing and delivery teams access the record to manage reverse logistics, inspect returned items, and issue credits or replacements. The record helps the organization track return reasons, recover value, and improve product quality and customer satisfaction.</script></div>
