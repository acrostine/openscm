						<div class="markdown-doc"><script type="text/plain">**An approved action needs an owner.** When an Action Proposal is approved or a Claim Decision requires action without an owner, this process allocates the work to a specific responsible party with the authority and competence to carry it out. The assignment includes a committed completion date, so execution begins.

**Resource Availability prevents overload.** The process reviews the skills, authority, and time frame required in the Action Proposal, then selects the qualified candidate with the lightest relevant workload. If no candidate is available by the required date, it records an Assignment Escalation and halts until a resource is freed. This protects against assigning an overloaded or unqualified person.

**An Assignment Record commits the work.** The selected person confirms acceptance, and the process issues an Assignment Record linking the action to the responsible party, the due date, and any special instructions. The responsible party and the action originator are both notified. The action now has a named owner and is ready for execution.</script></div>
