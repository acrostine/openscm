						<div class="markdown-doc"><script type="text/plain">**A measure of blocked finished goods inventory.** This assessment shows, in days of supply, the quantity of finished goods that is completely unavailable for customer orders or production use because of quality failures, safety concerns, or other blocking reasons. Supply chain and quality teams use this metric to monitor the amount of stock that does not generate revenue and requires scrapping or rework. It supports decisions on inventory write-offs, disposition, and process improvement to reduce the occurrence of blocked stock.</script></div>
