						<div class="markdown-doc"><script type="text/plain">**A request for pricing on contract renewal.** Renewal Request for Quote records a customer's request for renewed pricing and terms for an existing contract. The customer creates the request when the current agreement nears expiration. Receive Request and Develop Renewal processes access it to evaluate the renewal opportunity and prepare a quote. The record holds desired quantities, service levels, and term length, enabling the organisation to respond with competitive renewal proposals and maintain customer relationships.</script></div>
