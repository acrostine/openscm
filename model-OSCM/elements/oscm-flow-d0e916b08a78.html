							<br>
						<div class="markdown-doc"><script type="text/plain">**A complete budget dataset** underpins gap assessment. When all budget inputs from accounting and planning records are collected and validated, the Budget Data Pack arrives with budgeted amounts, actuals, commitments, forecast positions, the period covered, and the source of each figure. This single consistent dataset lets gap assessment compare planned funding against actual and committed spending. The availability of these figures makes shortfall quantification possible and protects gap assessment from proceeding without actual and forecast amounts.</script></div>
