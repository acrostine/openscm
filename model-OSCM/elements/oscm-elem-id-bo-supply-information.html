					<div role="tabpanel" class="tab-pane active" id="documentation">
						<div class="markdown-doc"><script type="text/plain">**A collection of supply-side data.** Supply Information aggregates details about available resources, capacities, and supply plans. It is created and updated by sourcing and planning teams to reflect current and projected supply conditions. The processes Gather Supply (Resources) and Balance Supply & Demand access this object to align supply with demand. It supports decisions on inventory allocation, production scheduling, and procurement. By centralizing supply data, it enables planners to identify shortages, surpluses, and risks, and to make informed adjustments to meet customer requirements.</script></div>
