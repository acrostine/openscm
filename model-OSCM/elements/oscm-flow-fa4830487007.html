							<br>
						<div class="markdown-doc"><script type="text/plain">**Load confirmation for completed vehicle** records the vehicle identifier, loaded piece counts, weights, and the sequence of stops. It is issued only after every shipment assigned to that vehicle has been placed, secured, and matched to the shipping schedule by weight. When it arrives, the outbound shipment is released to the carrier and the load is cleared to depart, so the vehicle does not sit at the dock and outgoing shipments move on schedule. This confirmation is the last step before the load leaves.</script></div>
