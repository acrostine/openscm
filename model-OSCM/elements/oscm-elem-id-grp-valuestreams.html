						<div class="markdown-doc"><script type="text/plain">**A category of end-to-end flows.** This grouping organises the value streams that describe how work moves from customer need to fulfilled demand. Process designers and business architects define these flows to show the sequence of activities, the roles involved, and the information and materials that pass between them. Leaders and improvement teams rely on value streams to identify waste, measure lead time, and align cross-functional efforts. They provide a holistic view of value creation, linking planning, sourcing, making, and delivering into a coherent whole.</script></div>
