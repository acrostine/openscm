						<div class="markdown-doc"><script type="text/plain">**Invoice for delivered order or service** details the amount due, payment terms, invoice number, line items, quantities, and the reference to the fulfilled order or shipment. It is issued only after the related shipment or service has been delivered and billing terms are met. Once it arrives, payment approval reviews the invoice against the purchase order or contract and schedules payment, clearing the path for on-time supplier payment and ensuring the supplier balance does not remain open for lack of an invoice.</script></div>
