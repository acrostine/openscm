						<div class="markdown-doc"><script type="text/plain">**The current Contract** is issued once the record is updated to the latest signed state and marked current. It carries party identities, terms, pricing, service levels, duration, and any amendments or renewal status. With this authoritative version in place, each new order is created using the contract's current pricing and only the items the agreement allows. This prevents order creation from lacking a valid contractual basis and ensures every order line reflects the latest agreed terms.</script></div>
