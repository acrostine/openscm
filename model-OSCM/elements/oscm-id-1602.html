						<div class="markdown-doc"><script type="text/plain">**A reporting period closes.** When a period closes or a regulator requires a report, the work consolidates audit findings into a single performance view. Targets from the Compliance Policy Set are compared against actuals; misses are summarised with severity. The draft report is reviewed for accuracy, approved, and submitted through the required channel. A Compliance Status Message is distributed to internal stakeholders according to the Stakeholder Communication Schedule.

**Reports draw on audit findings.** The process assembles Audit Reports from the period and pulls in Incident Records that must be disclosed. If a data gap exists, the missing evidence is requested and submission is delayed until the gap is resolved. This ensures the report is complete before it goes out.

**The submitted report gets archived.** The **Compliance Report Register Update** records the report submitted, the date, and the contents, giving the organisation a retrievable record of its disclosures.</script></div>
