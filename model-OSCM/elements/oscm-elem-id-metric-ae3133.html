						<div class="markdown-doc"><script type="text/plain">**A measure of how much produced output is thrown away.** It shows the share of items that fail quality checks so badly they are not used or sold. Quality inspectors record disposal events, and production supervisors track the rate to understand waste. The metric helps operations teams find the root causes of severe defects and reduce material losses. It is used in daily production reviews and quality improvement projects. Together with devalued and rework rates, it gives a complete picture of output that does not meet standard.</script></div>
