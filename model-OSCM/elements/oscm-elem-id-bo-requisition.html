						<div class="markdown-doc"><script type="text/plain">**An internal request for goods or services.** Requisition records a request from within the organisation to obtain specific goods or services. An employee or department creates it when a need arises. Route & Schedule Order, Create Order, and Schedule Project Resources processes access the requisition to convert it into a purchase order or work assignment. The record includes item details, quantities, required dates, and approval status, ensuring that internal requests are properly authorized and fulfilled.</script></div>
