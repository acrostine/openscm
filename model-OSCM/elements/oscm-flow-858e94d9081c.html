						<div class="markdown-doc"><script type="text/plain">**Change Portfolio Assessment informs budgets.** The Change Portfolio Assessment records the current set of proposed changes with scores for strategic fit, cost exposure, risk level, and implementation readiness, plus explicit dependencies and a recommended priority order. It is issued only after every pending change has been assessed against the current portfolio budget and strategic objectives. Its arrival completes the assessment and makes the ranked change set available. Budget change proposals draw on the recorded cost and benefit estimates, so funding adjustments align with the priority order and resource conflicts remain visible.</script></div>
