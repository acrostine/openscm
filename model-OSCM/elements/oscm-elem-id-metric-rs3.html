					<div role="tabpanel" class="tab-pane active" id="documentation">
						<div class="markdown-doc"><script type="text/plain">**A measure of disposition processing speed.** It tracks the time from when a product is designated for disposition, such as return, repair, recycle, or disposal, to when the disposition is completed. This metric helps supply chain managers monitor the efficiency of reverse logistics and returns management. It is influenced by the sell renewal process, which generates returned items, and the source returns process, which handles supplier returns. By reducing disposition cycle time, organizations can improve asset recovery and reduce holding costs.</script></div>
