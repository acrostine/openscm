							<br>
						<div class="markdown-doc"><script type="text/plain">**Assignment Record authorises implementation** by naming the owner, the action to be implemented, the due date, and the scope of work. It is issued when an action has been determined and assigned to a responsible party, meaning implementation is authorised to begin. The assigned action is then implemented by the named owner within the stated due date. This keeps the action from lacking an accountable owner and ensures it does not remain unexecuted.</script></div>
