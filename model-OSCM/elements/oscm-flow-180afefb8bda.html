							<br>
							<br>
						<div class="markdown-doc"><script type="text/plain">**Draft Demand Forecast enables accuracy checks.** It carries estimated demand quantities by item and period, along with the assumptions and data sources behind the estimate. It is issued once demand signals have been gathered and an initial statistical or judgmental forecast is produced. On arrival, the forecast is checked against historical patterns and reasonableness rules. That check is the step that turns a raw forecast into a verified one. Without it, no demand validation happens and the raw forecast stays unverified.</script></div>
