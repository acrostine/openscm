						<div class="markdown-doc"><script type="text/plain">**A return question arrives.** A customer asks whether a previous purchase can be returned and under what conditions. The work here checks that question against the original order and the current return policy. It gives a binding answer before any return movement starts. This protects the business from later disputes by establishing eligibility up front.

**The answer depends on two records.** It pulls the purchase date, quantities, and delivery point from the Customer Order, and the allowed reasons and condition requirements from the Return Policy. If the order reference cannot be matched, or the policy is missing, the inquiry is refused outright. When the checks pass, the process issues a **Return Inquiry Response** stating eligibility and next steps. That response is stored and later matched to any formal return request, closing the loop.</script></div>
