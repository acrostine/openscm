						<div class="markdown-doc"><script type="text/plain">**Proposal Submission Record confirms formal submission.** It captures the date, recipient, delivery channel, and version of the proposal submitted. Issued when the proposal is submitted and receipt is logged, it arrives as evidence of the formal submission. Its arrival allows negotiation to proceed on the basis of the submitted version. This handover prevents ambiguity about whether a proposal was submitted and gives negotiation a fixed reference point for the discussions.</script></div>
