						<div class="markdown-doc"><script type="text/plain">**Formal submission needs a complete package.** A **Contract Proposal** packages the final proposal terms, pricing, scope, and compliance references for formal submission to the requesting party. It is issued when the proposal is initiated and approved for external submission, arriving as the submission-ready version. Its arrival causes the proposal to be delivered to the requesting party with a formal submission record, ensuring the requesting party receives an offer to consider.</script></div>
