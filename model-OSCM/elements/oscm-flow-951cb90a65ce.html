							<br>
						<div class="markdown-doc"><script type="text/plain">**Resource Assignment commits the people** by naming the individuals or teams allocated to each action, their time commitment, and the period of assignment. It is issued when advisory initiation has secured the necessary people and capacity, so its arrival means the named resources are committed to the work. Implementation then begins with these assigned people and their committed time, so actions are resourced from the start. Without the Resource Assignment, implementation lacks the allocated individuals and stalls.</script></div>
