							<br>
						<div class="markdown-doc"><script type="text/plain">**A Customer Order carries** the requested items, quantities, delivery address, and terms that define the order needs. When a customer places an order, this Customer Order establishes the demand signal that sourcing acts on. Its arrival means the order's needs are gathered as sourcing demand. That handover gives sourcing the specific demand signal required to plan inputs, protecting against a situation where sourcing has no demand signal and no inputs are planned.</script></div>
