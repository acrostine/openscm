						<div class="markdown-doc"><script type="text/plain">**A counterproposal arrives.** The structured back-and-forth aligns proposed standard terms with the counterparty's position. It compares each requested change against the Current Standard Terms, marks the differences, and assesses each one against the Negotiation Mandate. Each difference is either acceptable, acceptable with a concession, or unacceptable.

**It stays inside authorised limits.** The process uses the Draft Contract, the Counterproposal, and the Negotiation Mandate. A proposed term outside the mandate escalates to an authorised approver; if the approver refuses, the process records deadlock and stops. This protects the organisation from agreeing to terms it never authorised. It also checks the Contract Register for prior agreements and open obligations that constrain the negotiation.

**Concession Log records every deviation.** As concessions are made, each one is documented with its rationale and the approving source. When no unresolved differences remain, the result is Negotiated Terms.</script></div>
