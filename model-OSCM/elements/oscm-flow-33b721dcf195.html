						<div class="markdown-doc"><script type="text/plain">**Signed proof of delivery** carries the signed receipt, delivery date, items, quantities, and exception notes for the delivered shipment. It is issued when the shipment is accepted and signed for at the destination, confirming delivery for the invoice. Invoicing finalises the customer invoice using this signed proof, attaching it as the delivery confirmation. This confirmation is what allows the invoice to be closed rather than left open while delivery verification is pending.</script></div>
