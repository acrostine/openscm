						<div class="markdown-doc"><script type="text/plain">**Shipment Notification gives receiving advance notice** This notice carries the shipment identifier, item count, packaging, carrier, expected arrival date, and unloading requirements. It is issued when the shipment is dispatched and the carrier provides the arrival estimate. With this notice, receiving can prepare dock capacity, staffing, and handling equipment for the incoming shipment, so the shipment does not arrive unannounced at the dock and receiving is not left without advance preparation.</script></div>
