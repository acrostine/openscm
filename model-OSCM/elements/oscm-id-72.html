						<div class="markdown-doc"><script type="text/plain">**Received Items arrive.** The process moves received items from the receiving area into storage locations and records where each item is placed. It first verifies that the Received Items are fit for storage by checking condition and documentation. The work makes returned or replenishment stock available for future picking and reservation.

**Placement updates inventory records.** The process determines an appropriate storage location based on item type, dimensions, and current capacity. It moves the items, confirms the location and quantity at placement, and updates the inventory record to show the items as available. If a location is full or unsuitable, it selects an alternative and updates the record.

**Putaway Confirmation records the spot.** After all items are placed, the process issues a Putaway Confirmation with the storage locations, item identifiers, and quantities placed. That record keeps the inventory accurate, so the stock can be reserved and picked. Items that arrive damaged or lack identifying documentation stay in the receiving area rather than entering the inventory record.</script></div>
