							<br>
						<div class="markdown-doc"><script type="text/plain">**Network compliance mapping relies on policy.** A **Compliance Policy** states the required behaviour, control points, responsible roles, and compliance thresholds for an obligation. It is issued when the policy is approved and published, arriving as the authoritative statement of compliance requirements. Its arrival causes the policy to be mapped to the applicable suppliers, locations, and materials in the network, ensuring the network has assigned compliance obligations for this policy, covering every applicable supplier, location, and material.</script></div>
