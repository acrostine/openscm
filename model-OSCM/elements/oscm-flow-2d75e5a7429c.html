							<br>
						<div class="markdown-doc"><script type="text/plain">**Production capacity and inventory availability** are described in a Supply Resource Plan. The plan records available production capacity, inventory, and supply commitments with time-phased availability for all resources. It is issued after resource availability has been collected and normalized into a common unit and period structure. When it arrives, supply availability is matched against demand to identify gaps. This handover makes shortage detection possible by ensuring balancing uses complete supply-side data.</script></div>
