						<div class="markdown-doc"><script type="text/plain">**A measure of asset value loss.** This assessment tracks the proportion or extent to which assets lose value within a given period. It is used to evaluate how well the organisation maintains the worth of its physical and intangible assets. Operations and finance teams record devaluation events, while asset managers and executives rely on the metric to decide on maintenance, insurance, or disposal priorities. The metric supports comparisons over time and across asset categories to identify where value erosion is highest and to guide corrective action.</script></div>
