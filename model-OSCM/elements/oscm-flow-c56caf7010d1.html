						<div class="markdown-doc"><script type="text/plain">**A supply market assessment guides sourcing** once market research is complete and the demand category context is established, signalling that market intelligence is current and approved for use. It carries supplier capability profiles, supply conditions, supplier landscape, pricing levels, capacity availability, market drivers, and risk indicators. Source identification then proceeds with a ranked view of capable suppliers and known market constraints; viable suppliers are not overlooked and market risks are directly compared. This validated landscape makes that comparison possible.</script></div>
