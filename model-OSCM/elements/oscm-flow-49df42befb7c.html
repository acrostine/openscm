						<div class="markdown-doc"><script type="text/plain">**The Sourcing Demand Statement** consolidates requested items, quantities, required dates, and originating internal demand references. It carries the net requirements that sourcing must satisfy. The statement is issued when demand has been collected and de-duplicated across requesting units, with each line tied to a consumption need. Once it arrives, requirement lines are translated into sourcing candidates, ensuring that sourcing calculations are based on the confirmed demand quantities and dates contained in the statement.</script></div>
