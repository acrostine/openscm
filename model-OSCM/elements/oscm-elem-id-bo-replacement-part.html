						<div class="markdown-doc"><script type="text/plain">**A component for replacing a failed part.** Replacement Part records a spare or substitute component used to repair or maintain products. Product engineering or sourcing teams define the part and its compatibility with parent products. Sell on Standard Terms offers replacement parts to customers, Source-to-Replenish ensures availability, and Re-Make uses them in refurbishment. The record includes part numbers, specifications, and interchangeability, enabling efficient service and support operations across the supply chain.</script></div>
