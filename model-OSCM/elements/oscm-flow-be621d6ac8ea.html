						<div class="markdown-doc"><script type="text/plain">**A Regulatory Announcement triggers impact assessment.** It carries the official text, effective date, issuing body, and any accompanying guidance for a new or changed obligation. Once captured from the monitoring source and recorded, it arrives as the original trigger for impact analysis. Its arrival means the regulatory content is analysed for operational impact and preliminary scope. This handover makes impact analysis possible and prevents the organisation from remaining unaware of the obligation.</script></div>
