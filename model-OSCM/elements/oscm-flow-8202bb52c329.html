							<br>
						<div class="markdown-doc"><script type="text/plain">**Validated demand quantities by period** are delivered in a Demand Forecast. The forecast presents validated demand quantities by item and period, including confidence levels and replacement of rejected estimates. It is issued when validation confirms the estimate against historical patterns and business rules. Once received, the forecast is matched against supply resources to determine balance. This handover ensures balancing uses validated demand, avoiding reliance on unverified estimates and keeping the balance analysis accurate.</script></div>
