							<br>
						<div class="markdown-doc"><script type="text/plain">**Effectiveness Review provides outcome evidence** by documenting the measured results of the advisory's actions against the original success measures, including variance and residual issues. It is issued after the monitoring period has produced sufficient evidence to assess outcomes, so its arrival means the results are available for publication. Advisory publication then uses these measured results to inform stakeholders of what worked and what did not. Without the Effectiveness Review, publication lacks the outcome evidence and variance analysis.</script></div>
