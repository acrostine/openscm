						<div class="markdown-doc"><script type="text/plain">**A measure of the speed of flow through a process.** It quantifies how quickly work, materials, or orders move through a defined part of the supply chain. In the Capacity Utilization group, it helps planners and managers assess whether capacity enables fast throughput or causes delays. Operations teams create it from transaction or movement data, and leadership uses it to identify bottlenecks, set improvement targets, and balance flow across steps. The assessment supports decisions about resource allocation and scheduling.</script></div>
