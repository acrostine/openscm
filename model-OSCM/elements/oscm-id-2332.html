						<div class="markdown-doc"><script type="text/plain">**Returned Goods sit at the dock.** The team checks the Routing Instruction to see where each item goes—inspection or storage—and reads any special handling flags. They verify that the receiving area holds the items listed in the Receiving Record before moving anything. This keeps the chain of custody intact from the moment goods leave the dock.

**Movement follows a designated path.** The goods are moved using that path, with special handling flags applied. Upon arrival, the new location is acknowledged in the Tracking Record. That update is what lets anyone find the goods later without walking the floor. If the Routing Instruction is missing or ambiguous, the move does not happen.

**A record stamps the move.** The **Transfer Record** records the moved items, the origin, the destination, and the time of the move. The Tracking Record is updated to reflect the new location. When the returned goods do not match the Receiving Record, the move stops and the discrepancy is resolved before anything goes further.</script></div>
