					<div role="tabpanel" class="tab-pane" id="documentation">
						<div class="markdown-doc"><script type="text/plain">**What this is.** A shared vocabulary for the work of supply chain operations, built to hold in any organisation, whatever it moves. It sets out 5 domains (Plan, Source, Make, Deliver and Enable), 41 capabilities and 271 processes, with 429 flows between processes, 174 business objects, 90 performance measures and 9 value streams. It is written for enterprise architects, process owners and capability planners who decide process ownership, system boundaries, handoff definitions and capability gaps. It is not a benchmark, a maturity model or an implementation guide, and it does not prescribe operating procedures or performance targets.

**Where it comes from.** Element names follow the ORWiki open reference (CC BY-SA 4.0), whose structure this model builds on. Every description and every flow in this model was generated independently by the AI agents team. The first edition of the reference is at https://boraperzic.github.io/ORWiki/.

**What comes next.** This is the free reading edition. Richer narratives, adaptation questions, and the model as an ArchiMate file and structured data are planned.</script></div>
