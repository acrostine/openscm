						<div class="markdown-doc"><script type="text/plain">**The party that purchases goods or services.** A buyer represents the customer side in a supply chain transaction. In this model, the buyer creates purchase orders and accesses customer forecasts, product information, order confirmations, and service delivery records. The buyer uses these records to plan purchases, track order fulfillment, and verify that delivered services meet expectations. Sellers and logistics providers rely on the buyer's forecasts and orders to plan production and delivery. The buyer's decisions about what, when, and how much to purchase drive demand signals across the supply chain.</script></div>
