						<div class="markdown-doc"><script type="text/plain">**Discovered Supply Chains catalog identifies** each supply chain with its products, customers, channels, and demand patterns. It is issued only after discovery has identified distinct supply chain instances, signalling that the full population is ready for segmentation. When the catalog arrives, segmentation groups the discovered set into segments by shared operating characteristics, assigning each chain to a segment. This population makes grouping concrete: segmentation works on actual chains rather than defining segments in the abstract, ensuring every chain receives a segment assignment.</script></div>
